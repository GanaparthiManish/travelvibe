name: travelvibe_agent
description: "TravelVibe Agent Mobile App for verified local tour guides."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^8.2.0
  lottie: ^3.3.3
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  supabase_flutter: ^2.8.3
  provider: ^6.1.2
  intl: ^0.20.3
  timeago: ^3.7.1
  permission_handler: ^12.0.3
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  google_sign_in: ^6.2.1
  video_player: ^2.9.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#ffffff"

flutter:
  uses-material-design: true
